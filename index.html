<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Check whether a car will scrape on a garage ramp: to-scale side view with bumpers, underbody, roof and mirror width.">
<title>Will My Car Clear the Ramp?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: an operations dashboard. KPI tiles across the top, the to-scale side elevation as the main instrument, inputs in a docked panel. */
:root {
  --bg: #EDF0F4;
  --panel: #FFFFFF;
  --inset: #F5F7FA;
  --ink: #17202A;
  --muted: #5C6977;
  --rule: #DAE0E7;
  --accent: #1F5FB8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3ECF8;
  --go: #16855A;
  --warn: #B07008;
  --stop: #CB3A31;
  --ground: #CDD4DB;
  --ground-hatch: #B0BAC4;
  --car-fill: #D3E1F5;
  --tyre: #232A31;
  --field: #FFFFFF;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1218; --panel: #151C24; --inset: #10161D; --ink: #E1E7EE; --muted: #8B98A7; --rule: #26303B;
    --accent: #5E9CF4; --accent-ink: #0B1626; --accent-soft: #1A2A42; --go: #3DC487; --warn: #E6AF4A; --stop: #F2675C;
    --ground: #29323C; --ground-hatch: #394450; --car-fill: #1F3350; --tyre: #05080B; --field: #0F151C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1218; --panel: #151C24; --inset: #10161D; --ink: #E1E7EE; --muted: #8B98A7; --rule: #26303B;
  --accent: #5E9CF4; --accent-ink: #0B1626; --accent-soft: #1A2A42; --go: #3DC487; --warn: #E6AF4A; --stop: #F2675C;
  --ground: #29323C; --ground-hatch: #394450; --car-fill: #1F3350; --tyre: #05080B; --field: #0F151C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1400px; margin: 0 auto; padding-block: 14px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: .01em; }
h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.mono, input[type=number] { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* top bar */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand p { margin: 0; font-size: 13px; color: var(--muted); }
.top-ctl { display: flex; gap: 8px; flex-wrap: wrap; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
@media (max-width: 560px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .kpi { padding: 10px 11px; }
  .kpi .k-val { font-size: 20px; }
  .kpi .k-head { flex-direction: column; align-items: flex-start; gap: 4px; }
  .kpi .k-note { display: none; }
  .kpi.overall .k-note { display: block; }
  .kpi.overall .k-head { flex-direction: row; }
}
.kpi { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .k-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kpi .k-lbl { font-family: var(--font-display); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.kpi .k-val { font-family: var(--font-data); font-size: 26px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .k-word { font-size: 13px; color: var(--muted); }
.kpi .k-note { font-size: 12px; color: var(--muted); }
.kpi.overall { grid-column: span 2; }
@media (max-width: 560px) { .kpi.overall { grid-column: 1 / -1; } }
.kpi.overall .k-val { font-family: var(--font-display); font-size: 30px; font-weight: 700; }
.kpi.overall .k-text { font-size: 15px; font-weight: 500; }
.pill { font-family: var(--font-display); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; background: var(--inset); color: var(--muted); border: 1px solid var(--rule); white-space: nowrap; }
.go .pill { color: var(--go); border-color: color-mix(in srgb, var(--go) 45%, transparent); background: color-mix(in srgb, var(--go) 12%, transparent); }
.warn .pill { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.stop .pill { color: var(--stop); border-color: color-mix(in srgb, var(--stop) 45%, transparent); background: color-mix(in srgb, var(--stop) 12%, transparent); }
.go .k-val.sig { color: var(--go); } .warn .k-val.sig { color: var(--warn); } .stop .k-val.sig { color: var(--stop); }

/* layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
@media (min-width: 1060px) { .layout { grid-template-columns: minmax(0, 1.7fr) minmax(350px, 1fr); } }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sub2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 760px) { .sub2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 28px; }
canvas { width: 100%; display: block; border-radius: 6px; touch-action: none; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .grow { flex: 1 1 160px; min-width: 0; }
.readout { font-family: var(--font-data); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 18px; }
.readout b { color: var(--ink); font-weight: 500; }
.msg { font-size: 13px; padding: 8px 10px; border-radius: 6px; background: color-mix(in srgb, var(--stop) 12%, transparent); border: 1px solid color-mix(in srgb, var(--stop) 40%, transparent); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 3px; margin-right: 4px; vertical-align: middle; background: var(--sw); border-radius: 2px; }
.width-out { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }

/* controls */
button, select, input { font: inherit; color: inherit; }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-weight: 500; line-height: 1.2; min-height: 32px; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 85%, var(--ink)); }
.btn.icon { width: 36px; padding: 5px 0; font-family: var(--font-data); }
.btn.small { min-height: 28px; padding: 3px 9px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=number], input[type=text], select { background: var(--field); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 8px; min-height: 32px; min-width: 0; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.seg-ctl { display: inline-flex; background: var(--inset); border: 1px solid var(--rule); border-radius: 6px; padding: 2px; gap: 2px; }
.seg-ctl button { border: 0; background: transparent; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--muted); min-height: 26px; }
.seg-ctl button[aria-pressed=true] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--rule); font-weight: 600; }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }

/* tabs */
.tabs { display: flex; border-bottom: 1px solid var(--rule); margin: 0 -14px; padding: 0 8px; }
.tabs button { border: 0; background: transparent; padding: 8px 10px; cursor: pointer; font-family: var(--font-display); font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button.dirty::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.tabpanel { display: flex; flex-direction: column; gap: 14px; padding-top: 4px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px 12px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span:first-child { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; justify-content: space-between; }
.unit-wrap { position: relative; display: block; }
.unit-wrap input { width: 100%; padding-right: 36px; }
.unit-wrap i { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 11px; color: var(--muted); pointer-events: none; }
.field.est input { border-style: dashed; border-color: var(--warn); }
.field.changed input { border-color: var(--accent); background: var(--accent-soft); }
.tag { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 0 5px; border-radius: 3px; border: 1px solid var(--warn); color: var(--warn); }
.derived { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.derived b { color: var(--ink); font-weight: 500; }
.kv { display: flex; flex-direction: column; gap: 5px; }
.kv > span { font-size: 12px; color: var(--muted); }
.lookup { display: flex; gap: 8px; flex-wrap: wrap; }
.lookup input { flex: 1 1 190px; }
.lookup-status { font-size: 12px; color: var(--muted); }
.lookup-status.err { color: var(--stop); }
.source { font-size: 12px; padding: 8px 10px; border-radius: 6px; background: var(--inset); color: var(--muted); }
.source b { color: var(--ink); font-weight: 600; }
details.measure { border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; }
details.measure summary { cursor: pointer; font-weight: 600; font-size: 13px; }
details.measure ol { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.segs { display: flex; flex-direction: column; gap: 8px; }
.seg, .seg-head { display: grid; grid-template-columns: 24px minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr) 32px; gap: 6px; align-items: center; }
.seg-head { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.seg .n { font-family: var(--font-data); font-size: 12px; color: var(--muted); text-align: center; }
.seg input, .seg select { width: 100%; }
.seg .calc { grid-column: 2 / 5; font-family: var(--font-data); font-size: 11px; color: var(--muted); margin-top: -3px; }
.seg .calc.err { color: var(--stop); }
.endcap { font-size: 11px; color: var(--muted); font-family: var(--font-data); padding-left: 30px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.applybar { position: sticky; bottom: env(safe-area-inset-bottom, 0px); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 14px; margin: 0 -14px -14px; background: var(--panel); border-top: 1px solid var(--rule); border-radius: 0 0 8px 8px; z-index: 2; }
.applybar .state { font-size: 12px; color: var(--muted); flex: 1 1 140px; min-width: 0; }
.applybar .state.pending { color: var(--warn); font-weight: 600; }
footer { font-size: 12px; color: var(--muted); max-width: 100ch; }
</style>
</head>
<body>

<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="0.5" y="0.5" width="33" height="33" rx="7" fill="var(--accent-soft)" stroke="var(--rule)"/><path d="M4 26 H11 L23 16 H30" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/><circle cx="14.5" cy="20" r="2.2" fill="var(--ink)"/><circle cx="21" cy="14.6" r="2.2" fill="var(--ink)"/></svg>
      <div><h1 data-i="title">Will my car clear the ramp?</h1><p data-i="sub"></p></div>
    </div>
    <div class="top-ctl">
      <div class="seg-ctl" role="group" aria-label="Language">
        <button id="lang-en" aria-pressed="true">EN</button>
        <button id="lang-hu" aria-pressed="false">HU</button>
      </div>
      <div class="seg-ctl" role="group" aria-label="Theme">
        <button id="th-auto" aria-pressed="true" data-i="thAuto">Auto</button>
        <button id="th-light" aria-pressed="false" data-i="thLight">Light</button>
        <button id="th-dark" aria-pressed="false" data-i="thDark">Dark</button>
      </div>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-live="polite"></section>

  <div class="layout">
    <div class="col">
      <section class="panel">
        <div class="ph">
          <h2 data-i="side"></h2>
          <div class="row">
            <div class="seg-ctl" role="group" aria-label="Zoom">
              <button id="zoom-whole" data-i="zWhole"></button>
              <button id="zoom-car" data-i="zCar"></button>
              <button id="zoom-close" data-i="zClose"></button>
            </div>
            <div class="seg-ctl" role="group" aria-label="Vertical scale">
              <button id="vx-1">1×</button>
              <button id="vx-2" data-i="vx2"></button>
            </div>
          </div>
        </div>
        <canvas id="side"></canvas>
        <div class="toolbar">
          <button class="btn icon" id="back" aria-label="−5 cm">‹</button>
          <button class="btn primary" id="play"></button>
          <button class="btn icon" id="fwd" aria-label="+5 cm">›</button>
          <div class="grow"><input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Position"></div>
          <select id="speed" aria-label="Speed">
            <option value="0.08" data-i="sp1"></option>
            <option value="0.25" data-i="sp2" selected></option>
            <option value="0.6" data-i="sp3"></option>
          </select>
        </div>
        <div class="toolbar">
          <div class="seg-ctl" role="group" aria-label="Direction">
            <button id="dir-fwd" data-i="dirFwd"></button>
            <button id="dir-rev" data-i="dirRev"></button>
          </div>
          <label class="chk"><input type="checkbox" id="stop-contact" checked> <span data-i="stopContact"></span></label>
          <button class="btn small" id="to-worst" data-i="toWorst"></button>
        </div>
        <div class="readout" id="readout"></div>
        <div class="msg" id="contact-msg" hidden></div>
      </section>

      <div class="sub2">
        <section class="panel">
          <div class="ph"><h2 data-i="chartT"></h2></div>
          <div class="legend">
            <span style="--sw: var(--accent)" data-i="zBelly"></span>
            <span style="--sw: var(--ink)" data-i="zFront"></span>
            <span style="--sw: var(--muted)" data-i="zRear"></span>
            <span style="--sw: var(--warn)" data-i="marginL"></span>
          </div>
          <canvas id="chart"></canvas>
          <p class="hint" data-i="chartHint"></p>
        </section>
        <section class="panel">
          <div class="ph"><h2 data-i="planT"></h2><span class="hint mono" id="plan-hint"></span></div>
          <canvas id="plan"></canvas>
          <div class="width-out" id="width-out"></div>
        </section>
      </div>
    </div>

    <section class="panel" aria-label="Inputs">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-car" aria-selected="true" aria-controls="p-car" data-i="tCar"></button>
        <button role="tab" id="tab-slope" aria-selected="false" aria-controls="p-slope" data-i="tSlope"></button>
        <button role="tab" id="tab-width" aria-selected="false" aria-controls="p-width" data-i="tWidth"></button>
      </div>

      <div class="tabpanel" id="p-car" role="tabpanel">
        <div class="kv">
          <span data-i="lookupL"></span>
          <div class="lookup">
            <input type="text" id="lookup-q" autocomplete="off" data-i-ph="lookupPh">
            <button class="btn primary" id="lookup-go" data-i="lookupGo"></button>
            <button class="btn" id="lookup-stop" data-i="stop" hidden></button>
          </div>
          <div class="lookup-status" id="lookup-status"></div>
        </div>
        <div class="kv">
          <span data-i="presetL"></span>
          <select id="preset"></select>
        </div>
        <div class="source" id="car-source"></div>
        <div class="fields" id="car-fields"></div>
        <div class="field" style="max-width: 320px;">
          <span data-i="tyreL"></span>
          <div class="row"><input type="text" id="tyre-size" placeholder="205/55 R16" style="flex:1"><button class="btn small" id="tyre-apply" data-i="use"></button></div>
        </div>
        <div class="derived" id="car-derived"></div>
        <details class="measure">
          <summary data-i="measureT"></summary>
          <ol id="measure-list"></ol>
        </details>
        <div class="applybar">
          <span class="state" id="car-state"></span>
          <button class="btn" id="car-undo" data-i="undo"></button>
          <button class="btn primary" id="car-apply" data-i="apply"></button>
        </div>
      </div>

      <div class="tabpanel" id="p-slope" role="tabpanel" hidden>
        <div class="kv">
          <span data-i="measuredL"></span>
          <div class="seg-ctl" role="group">
            <button id="m-surface" data-i="mSurface"></button>
            <button id="m-horiz" data-i="mHoriz"></button>
          </div>
        </div>
        <p class="hint" data-i="segHint"></p>
        <div class="seg-head"><span></span><span data-i="hLen"></span><span data-i="hAs"></span><span data-i="hVal"></span><span></span></div>
        <div class="endcap" data-i="street"></div>
        <div class="segs" id="segs"></div>
        <div class="endcap" data-i="garage"></div>
        <div class="row">
          <button class="btn small" id="add-seg" data-i="addSeg"></button>
          <button class="btn small" id="add-bottom" data-i="addBottom"></button>
          <button class="btn small" id="add-top" data-i="addTop"></button>
        </div>
        <div class="kv">
          <span data-i="shapeL"></span>
          <div class="row">
            <button class="btn small" id="shape-simple" data-i="shSimple"></button>
            <button class="btn small" id="shape-eased" data-i="shEased"></button>
            <button class="btn small" id="shape-down" data-i="shDown"></button>
          </div>
        </div>
        <div class="fields">
          <label class="field"><span data-i="marginL"></span><span class="unit-wrap"><input type="number" id="margin" min="0" step="0.5"><i>cm</i></span></label>
          <label class="field"><span data-i="headerL"></span><span class="unit-wrap"><input type="number" id="header" min="0" step="0.01" data-i-ph="off"><i>m</i></span></label>
        </div>
        <p class="hint" data-i="marginHint"></p>
        <div class="applybar">
          <span class="state" id="slope-state"></span>
          <button class="btn" id="slope-undo" data-i="undo"></button>
          <button class="btn primary" id="slope-apply" data-i="apply"></button>
        </div>
      </div>

      <div class="tabpanel" id="p-width" role="tabpanel" hidden>
        <div class="fields">
          <label class="field"><span data-i="rampW"></span><span class="unit-wrap"><input type="number" id="ramp-w" min="0" step="0.01"><i>m</i></span></label>
          <label class="field"><span data-i="doorW"></span><span class="unit-wrap"><input type="number" id="door-w" min="0" step="0.01" data-i-ph="off"><i>m</i></span></label>
        </div>
        <div class="kv">
          <span data-i="sidesL"></span>
          <div class="seg-ctl" role="group">
            <button id="sides-walls" data-i="walls"></button>
            <button id="sides-curbs" data-i="curbs"></button>
          </div>
        </div>
        <p class="hint" data-i="sidesHint"></p>
        <label class="chk"><input type="checkbox" id="fold"> <span data-i="foldL"></span></label>
        <div class="kv">
          <span><span data-i="phiL"></span> <b class="mono" id="phi-out">0°</b></span>
          <input type="range" id="phi" min="0" max="35" step="1" value="0">
        </div>
        <p class="hint" data-i="phiHint"></p>
        <p class="hint" data-i="widthLive"></p>
      </div>
    </section>
  </div>

  <footer data-i="footer"></footer>
</div>

<script id="core">
// ---------- geometry core (units: metres, radians) ----------
function segDelta(seg, measure) {
  const len = Math.max(0, +seg.len || 0), v = +seg.val || 0;
  let dx, dy, err = null;
  if (seg.mode === 'rise') {
    dy = v;
    if (measure === 'surface') {
      if (Math.abs(v) >= len) { err = 'rise'; dx = 0.01; }
      else dx = Math.sqrt(len * len - v * v);
    } else dx = len;
  } else {
    let th = seg.mode === 'angle' ? v * Math.PI / 180 : Math.atan(v / 100);
    if (Math.abs(th) > 1.2) { err = 'steep'; th = Math.sign(th) * 1.2; }
    if (measure === 'surface') { dx = len * Math.cos(th); dy = len * Math.sin(th); }
    else { dx = len; dy = len * Math.tan(th); }
  }
  if (!(dx > 0.001)) { dx = 0.001; if (!err && len === 0) err = 'zero'; }
  return { dx, dy, err };
}

function buildProfile(slope, carLen, phi) {
  const lead = carLen + 2.5;
  const pts = [[0, 0], [lead, 0]];
  let x = lead, y = 0;
  const segInfo = [];
  for (const s of slope.segs) {
    const d = segDelta(s, slope.measure);
    const dx = d.dx / Math.cos(phi);
    segInfo.push({ ...d, x0: x, y0: y, x1: x + dx, y1: y + d.dy, grade: d.dy / d.dx });
    x += dx; y += d.dy;
    pts.push([x, y]);
  }
  const x0 = lead, x1 = x, yTop = y;
  pts.push([x + carLen + 2.5, y]);
  return { pts, x0, x1, yTop, segInfo };
}

function groundY(P, x) {
  if (x <= P[0][0]) return P[0][1];
  for (let i = 1; i < P.length; i++) {
    if (x <= P[i][0]) {
      const [ax, ay] = P[i - 1], [bx, by] = P[i];
      return ay + (by - ay) * (x - ax) / (bx - ax);
    }
  }
  return P[P.length - 1][1];
}

// Height of a wheel centre of radius r resting on the polyline at horizontal position x
function centerY(P, x, r) {
  let best = -Infinity;
  for (let i = 1; i < P.length; i++) {
    const [px, py] = P[i - 1], [qx, qy] = P[i];
    const dx = qx - px, dy = qy - py, len = Math.hypot(dx, dy);
    const nx = -dy / len, ny = dx / len;
    const t = (x - px - r * nx) / dx;
    if (t >= 0 && t <= 1) best = Math.max(best, py + t * dy + r * ny);
  }
  for (const [vx, vy] of P) {
    const d = x - vx;
    if (Math.abs(d) <= r) best = Math.max(best, vy + Math.sqrt(r * r - d * d));
  }
  if (best === -Infinity) best = groundY(P, x) + r;
  return best;
}

// Signed distance from point to ground polyline (positive = above)
function signedClear(P, x, y) {
  let dmin = Infinity;
  for (let i = 1; i < P.length; i++) {
    const [ax, ay] = P[i - 1], [bx, by] = P[i];
    if (bx < x - 1.5 || ax > x + 1.5) continue;
    const vx = bx - ax, vy = by - ay;
    let t = ((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy);
    t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(x - (ax + t * vx), y - (ay + t * vy));
    if (d < dmin) dmin = d;
  }
  if (dmin === Infinity) dmin = Math.abs(y - groundY(P, x));
  return y >= groundY(P, x) ? dmin : -dmin;
}

// Car geometry. Input in mm, output in m. u measured from the rear axle forward; h = height above level ground.
function carGeom(c) {
  const m = k => (+c[k] || 0) / 1000;
  const L = m('L'), WB = m('WB'), fo = m('fo'), H = m('H'), W = m('W'), Wm = m('Wm'), gc = m('gc'), hF = m('hF'), hR = m('hR');
  const r = Math.max(0.2, m('tyre') / 2);
  const ro = Math.max(0.1, L - WB - fo);
  const b1 = Math.min(0.9 * r, WB / 2), b2 = Math.max(WB - 0.9 * r, WB / 2);
  const under = [[-ro, hR], [b1, gc], [b2, gc], [WB + fo, hF]];
  const S = s => -ro + s * L;
  const top = [[S(0), 0.6 * H], [S(0.03), 0.71 * H], [S(0.2), 0.93 * H], [S(0.28), H], [S(0.6), H], [S(0.76), 0.68 * H], [S(0.95), 0.6 * H], [S(1), 0.5 * H]];
  const samples = [];
  for (let u = -ro; u <= WB + fo + 1e-9; u += 0.02) {
    let h;
    for (let i = 1; i < under.length; i++) {
      if (u <= under[i][0] + 1e-9) { const [a, ha] = under[i - 1], [b, hb] = under[i]; h = ha + (hb - ha) * (u - a) / Math.max(1e-6, b - a); break; }
    }
    samples.push({ u, h, zone: u < 0 ? 'rear' : u > WB ? 'front' : 'belly' });
  }
  // coarse set for the sweep: every 3rd sample plus the polyline corners (where minima sit)
  const coarse = samples.filter((_, i) => i % 3 === 0);
  for (const [u, h] of under) coarse.push({ u, h, zone: u < 0 ? 'rear' : u > WB ? 'front' : 'belly' });
  return { L, WB, fo, ro, H, W, Wm, gc, hF, hR, r, under, top, samples, coarse };
}

function makeSim(car, slope, phi) {
  const g = carGeom(car);
  const prof = buildProfile(slope, g.L, phi);
  const P = prof.pts;
  const rev = slope.dir === 'rev';
  const leadOver = rev ? g.ro : g.fo, trailOver = rev ? g.fo : g.ro;
  const toTravel = u => rev ? g.WB - u : u;   // u (rear-axle frame) -> distance ahead of trailing axle
  const xs = prof.x0 - 0.5 - leadOver - g.WB;
  const xe = prof.x1 + 0.5 + trailOver;
  const header = slope.header > 0 ? { x: prof.x1, y: prof.yTop + slope.header } : null;

  function pose(xt) {
    const yt = centerY(P, xt, g.r);
    let lo = xt, hi = xt + g.WB;
    for (let i = 0; i < 28; i++) {
      const mid = (lo + hi) / 2;
      if (Math.hypot(mid - xt, centerY(P, mid, g.r) - yt) < g.WB) lo = mid; else hi = mid;
    }
    const xl = (lo + hi) / 2, yl = centerY(P, xl, g.r);
    const a = Math.atan2(yl - yt, xl - xt);
    const ca = Math.cos(a), sa = Math.sin(a);
    const w = (u, h) => { const d = toTravel(u), v = h - g.r; return [xt + d * ca - v * sa, yt + d * sa + v * ca]; };
    return { xt, yt, xl, yl, a, w };
  }

  function evalAt(xt, fast) {
    const p = pose(xt);
    const zones = { front: Infinity, belly: Infinity, rear: Infinity };
    let min = Infinity, minPt = null, minZone = null;
    const pts = [];
    for (const s of (fast ? g.coarse : g.samples)) {
      const [x, y] = p.w(s.u, s.h);
      const c = signedClear(P, x, y);
      if (!fast) pts.push([x, y, c]);
      if (c < zones[s.zone]) zones[s.zone] = c;
      if (c < min) { min = c; minPt = [x, y]; minZone = s.zone; }
    }
    let head = null;
    if (header) {
      const roof = g.top.map(([u, h]) => p.w(u, h)).sort((A, B) => A[0] - B[0]);
      if (header.x >= roof[0][0] && header.x <= roof[roof.length - 1][0]) {
        for (let i = 1; i < roof.length; i++) {
          if (header.x <= roof[i][0]) { const [ax, ay] = roof[i - 1], [bx, by] = roof[i]; const ry = ay + (by - ay) * (header.x - ax) / Math.max(1e-6, bx - ax); head = header.y - ry; break; }
        }
      }
    }
    return { pose: p, zones, min, minPt, minZone, pts, head };
  }

  const step = 0.025, sweep = [];
  for (let x = xs; x <= xe + 1e-9; x += step) {
    const e = evalAt(x, true);
    sweep.push({ x, min: e.min, zone: e.minZone, zones: e.zones, head: e.head, pt: e.minPt });
  }
  let worst = sweep[0], worstHead = null;
  for (const s of sweep) {
    if (s.min < worst.min) worst = s;
    if (s.head != null && (worstHead == null || s.head < worstHead.head)) worstHead = s;
  }
  return { g, prof, P, xs, xe, header, pose, evalAt, sweep, worst, worstHead, rev };
}

// Lateral footprint of the car at angle phi (rad); mirrors at 0.68 L from the rear end
function footprint(g, phi, useMirrors) {
  const pts = [];
  const hw = g.W / 2;
  for (const u of [0, g.L]) for (const s of [-1, 1]) pts.push([u, s * hw]);
  if (useMirrors) { const um = 0.68 * g.L; for (const s of [-1, 1]) pts.push([um, s * g.Wm / 2]); }
  const lat = pts.map(([u, v]) => u * Math.sin(phi) + v * Math.cos(phi));
  return Math.max(...lat) - Math.min(...lat);
}

function bumperFromAngle(overhangMm, tyreMm, deg) {
  const r = tyreMm / 2, a = deg * Math.PI / 180;
  return Math.round(overhangMm * Math.tan(a) + r - r / Math.cos(a));
}
function tyreFromSize(str) {
  const m = String(str || '').match(/(\d{3})\s*\/\s*(\d{2})\s*[A-Z]*\s*R?\s*(\d{2}(?:\.\d)?)/i);
  if (!m) return null;
  return Math.round(+m[1] * +m[2] / 100 * 2 + +m[3] * 25.4);
}

let sampleFn = null, lookupCtl = null, lookupBlocked = false, lookupMsg = { k: 'lkIdle', a: [] , err: false };
function showLookup(k, a = [], err = false) { lookupMsg = { k, a, err }; const st = $('#lookup-status'); st.textContent = t(k, ...a); st.classList.toggle('err', err); }
(async () => {
  try { sampleFn = window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch (e) { sampleFn = null; }
  if (!sampleFn) { lookupBlocked = true; $('#lookup-q').closest('.kv').hidden = true; }
})();
async function lookup() {
  const q = $('#lookup-q').value.trim(); if (!q || !sampleFn) return;
  showLookup('lkAsk');
  $('#lookup-go').disabled = true; $('#lookup-stop').hidden = false;
  lookupCtl = new AbortController();
  const prompt = `You are filling in a vehicle geometry form for a garage-ramp clearance check. Vehicle: "${q.replace(/"/g, "'")}".
Give factory dimensions for the most likely variant and say which generation, body style and years you assumed. Units: millimetres and degrees. Use null when you have no real basis for a value; do not make up approach or departure angles.
Reply with only this JSON object:
{"vehicle": "full name you assumed", "length": 0, "wheelbase": 0, "front_overhang": null, "rear_overhang": null, "height": 0, "width": 0, "width_mirrors": null, "ground_clearance": null, "tyre_size": "205/55 R16", "approach_angle": null, "departure_angle": null, "estimated": ["names of fields that are your estimates rather than published specs"], "notes": "one or two short sentences, e.g. how sport suspension or bigger wheels change clearance"}
"width" is the body width without mirrors. "tyre_size" is the most common standard size.${lang === 'hu' ? ' Write "notes" in Hungarian.' : ''}`;
  try {
    const d = await sampleFn.json(prompt, { signal: lookupCtl.signal });
    const n = v => (typeof v === 'number' && isFinite(v) && v > 0) ? v : null;
    const L = n(d.length), WB = n(d.wheelbase);
    if (!L || !WB) throw { code: 'no_dims' };
    const est = new Set(Array.isArray(d.estimated) ? d.estimated : []);
    const map = { length: 'L', wheelbase: 'WB', front_overhang: 'fo', height: 'H', width: 'W', width_mirrors: 'Wm', ground_clearance: 'gc' };
    const car = { name: String(d.vehicle || q), src: 'claude', notes: String(d.notes || ''), est: [], edited: false };
    for (const [jk, k] of Object.entries(map)) if (est.has(jk)) car.est.push(k);
    car.L = Math.round(L); car.WB = Math.round(WB); car.H = Math.round(n(d.height) || 1500); car.W = Math.round(n(d.width) || 1800);
    if (!n(d.height)) car.est.push('H'); if (!n(d.width)) car.est.push('W');
    let fo = n(d.front_overhang);

    car.fo = Math.round(fo);
    car.Wm = Math.round(n(d.width_mirrors) || car.W + 220); if (!n(d.width_mirrors)) car.est.push('Wm');
    car.gc = Math.round(n(d.ground_clearance) || 140); if (!n(d.ground_clearance)) car.est.push('gc');
    const ty = tyreFromSize(d.tyre_size); car.tyre = ty || 650; if (!ty) car.est.push('tyre');

    car.hR = bumperFromAngle(car.L - car.WB - car.fo, car.tyre, n(d.departure_angle) || 17);
    car.est = [...new Set([...car.est, 'hF', 'hR'])];
    draft.car = car; applyDraft('car');
    showLookup('lkDone', [car.name, !!n(d.approach_angle)]);
  } catch (e) {
    const code = e && e.code;
    if (code === 'not_granted' || code === 'sampling_disabled') lookupBlocked = true;
    showLookup(code === 'cancelled' ? 'lkStopped' : lookupBlocked ? 'lkDenied' : code === 'rate_limited' ? 'lkRate' : code === 'no_dims' || code === 'invalid_json' ? 'lkBad' : 'lkFail', [], code !== 'cancelled');
  } finally {

}

// ---------- toggles ----------
const TOGGLES = [
  { ids: [['m-surface', 'surface'], ['m-horiz', 'horizontal']], get: () => draft.slope.measure, set: v => { draft.slope.measure = v; updateSegCalcs(); draftChanged(); } },
  { ids: [['dir-fwd', 'fwd'], ['dir-rev', 'rev']], get: () => state.drive, set: v => { state.drive = v; recompute(); } },
  { ids: [['sides-walls', 'walls'], ['sides-curbs', 'curbs']], get: () => state.width.sides, set: v => { state.width.sides = v; recompute(); } },
  { ids: [['zoom-whole', 'whole'], ['zoom-car', 'car'], ['zoom-close', 'close']], get: () => state.view.zoom, set: v => { state.view.zoom = v; save(); draw(); } },
  { ids: [['vx-1', 1], ['vx-2', 2]], get: () => state.view.vx, set: v => { state.view.vx = v; save(); draw(); } },
  { ids: [['lang-en', 'en'], ['lang-hu', 'hu']], get: () => state.lang, set: v => { state.lang = v; lang = v; save(); retranslate(); } },
  { ids: [['th-auto', 'auto'], ['th-light', 'light'], ['th-dark', 'dark']], get: () => state.theme, set: v => { state.theme = v; save(); applyTheme(); draw(); } },
];
function syncToggles() { for (const tg of TOGGLES) for (const [id, v] of tg.ids) document.getElementById(id).setAttribute('aria-pressed', String(tg.get() === v)); }
for (const tg of TOGGLES) for (const [id, v] of tg.ids) document.getElementById(id).addEventListener('click', () => { tg.set(v); syncToggles(); });

// ---------- theme ----------
const hostTheme = document.documentElement.getAttribute('data-theme');
let settingTheme = false;
function applyTheme() {
  settingTheme = true;
  const r = document.documentElement;
  if (state.theme === 'auto') { if (hostTheme) r.setAttribute('data-theme', hostTheme); else r.removeAttribute('data-theme'); }
  else r.setAttribute('data-theme', state.theme);
  settingTheme = false;
}

// ---------- tabs ----------
for (const id of ['car', 'slope', 'width']) $('#tab-' + id).addEventListener('click', () => {
  for (const o of ['car', 'slope', 'width']) { $('#tab-' + o).setAttribute('aria-selected', String(o === id)); $('#p-' + o).hidden = o !== id; }
});

// ---------- playback controls ----------
$('#play').addEventListener('click', () => setPlaying(!playing));
$('#back').addEventListener('click', () => { setPlaying(false); moveTo(pos - 0.05); });
$('#fwd').addEventListener('click', () => { setPlaying(false); moveTo(pos + 0.05); });
$('#scrub').addEventListener('input', e => { setPlaying(false); moveTo(sim.xs + e.target.value / 1000 * (sim.xe - sim.xs)); });
$('#to-worst').addEventListener('click', () => { setPlaying(false); moveTo(sim.worst.x); });
const chartEl = $('#chart'); let chartDrag = false;
const chartMove = e => { const m = chartEl._map; if (!m) return; const r = chartEl.getBoundingClientRect(); const f = (e.clientX - r.left - m.L) / (m.w - m.L - m.R); setPlaying(false); moveTo(sim.xs + Math.max(0, Math.min(1, f)) * (sim.xe - sim.xs)); };
chartEl.addEventListener('pointerdown', e => { chartDrag = true; chartEl.setPointerCapture(e.pointerId); chartMove(e); });
chartEl.addEventListener('pointermove', e => { if (chartDrag) chartMove(e); });
chartEl.addEventListener('pointerup', () => { chartDrag = false; });

// ---------- translation pass ----------
function retranslate() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = t(el.dataset.i); });
  document.querySelectorAll('[data-i-ph]').forEach(el => { el.placeholder = t(el.dataset.iPh); });
  $('#measure-list').innerHTML = T[lang].measure.map(x => `<li>${x}</li>`).join('');
  showLookup(lookupMsg.k, lookupMsg.a, lookupMsg.err);
  renderPresets(); renderCarFields(); renderSegs(); updateApplyBars();
  if (sim) { updateKpis(); updateWidth(); draw(); }
}

// ---------- boot ----------
applyTheme();
$('#ramp-w').value = state.width.ramp || '';
$('#door-w').value = state.width.door || '';
$('#fold').checked = !!state.width.fold;
$('#phi').value = state.width.phi; $('#phi-out').textContent = state.width.phi + '°';
fillSlopeStatic(); syncToggles();
recompute(false);
retranslate();
new ResizeObserver(() => draw()).observe($('.layout'));
const mq = window.matchMedia('(prefers-color-scheme: dark)');
if (mq.addEventListener) mq.addEventListener('change', draw);
new MutationObserver(() => { if (!settingTheme) draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
</body>
</html>
